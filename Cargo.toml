[workspace]
resolver = "2"

members = [
    "crates/types",
    "crates/crypto",
    "crates/revm",
    "crates/consensus",
    "crates/state",
    "crates/mempool",
    "crates/executor",
    "crates/p2p",
    "crates/rpc",
]

# Future crates to be added in subsequent phases
# "crates/evm",
# "crates/wallet-sdk",
# "crates/node",

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Fortiquo Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }

# Hashing
blake3 = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# EVM
revm = { version = "14", features = ["std"] }
revm-primitives = "5"

# P2P
libp2p = { version = "0.54", features = ["tcp", "mdns", "noise", "yamux", "floodsub", "identify"] }

# RPC
jsonrpsee = { version = "0.23", features = ["server", "client", "macros"] }

# HTTP
axum = "0.7"
hyper = "1"

# Storage
rocksdb = { version = "0.22", features = ["multi-threaded-cf"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
hex = { version = "0.4", features = ["serde"] }
bytes = "1"

# Testing
proptest = "1"
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
